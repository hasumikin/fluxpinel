name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  # The weekly check of the master of spinel (the job spinel-master)
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

# A new push to a branch cancels the run that is still in progress on it.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # The checks of development.md on the pinned spinel, on Linux and on
  # macOS. A failure on one system does not stop the run on the other.
  check:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      # test/run.rb compares the output of Fluxpinel with CRuby 4.0.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"

      - name: Install libffi (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libffi-dev

      # The Makefile finds the kegs of Homebrew.
      - name: Install libffi and OpenSSL (macOS)
        if: runner.os == 'macOS'
        run: brew install libffi openssl

      # The gems of the Gemfile: those that --irb runs (irb, reline, rdoc,
      # prism) and the ffi gem of test/m3/ffi_gem.rb. make gems also builds
      # the shared library of the prism gem, which IRB loads.
      - name: Install the gems and build prism's shared library
        run: make gems

      # The build of spinel takes most of the time. The cache keeps it for
      # one pin, so only a change of SPINEL_COMMIT builds spinel again.
      - name: Restore spinel
        id: spinel-cache
        uses: actions/cache/restore@v6
        with:
          path: deps/spinel
          key: spinel-${{ runner.os }}-${{ hashFiles('SPINEL_COMMIT') }}

      # getconf gives the count of processors on both systems; macOS has
      # no nproc.
      - name: Fetch and build spinel
        run: make -j$(getconf _NPROCESSORS_ONLN) deps

      - name: Save spinel
        if: steps.spinel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: deps/spinel
          key: ${{ steps.spinel-cache.outputs.cache-primary-key }}

      - name: Build
        run: make -j$(getconf _NPROCESSORS_ONLN)

      - name: make test
        run: make test

      - name: make test-host
        run: make test-host

      - name: make regress
        run: make regress

      - name: Upload the regress cases
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regress-cases-${{ matrix.os }}
          path: build/regress/cases
          if-no-files-found: ignore

  # The same checks on the master of spinel, with no pin. A failure tells
  # that a change of spinel breaks Fluxpinel before the pin moves. The job
  # does not change SPINEL_COMMIT or tools/oracle_agree.txt.
  spinel-master:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"

      - name: Install libffi
        run: sudo apt-get update && sudo apt-get install -y libffi-dev

      - name: Install the gems and build prism's shared library
        run: make gems

      - name: Fetch and build spinel master
        run: |
          git clone -q --depth 1 https://github.com/matz/spinel.git deps/spinel
          git -C deps/spinel log -1 --format='spinel master: %H %s'
          make -C deps/spinel deps
          make -C deps/spinel -j$(nproc)

      - name: Build
        run: make -j$(nproc) SPINEL_PIN=0

      - name: make test
        run: make test SPINEL_PIN=0

      - name: make test-host
        run: make test-host SPINEL_PIN=0

      - name: make regress
        run: make regress SPINEL_PIN=0

      - name: Upload the regress cases
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regress-cases-spinel-master
          path: build/regress/cases
          if-no-files-found: ignore

  # The blog of Roundhouse with the console (docs/design.md, section 5.4),
  # on the pinned spinel. The pinned Roundhouse runs first, so a failure there
  # comes from Fluxpinel. Then the main of Roundhouse runs. The job does
  # not change ROUNDHOUSE_COMMIT in the repository.
  roundhouse:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"

      - name: Install the libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev libsqlite3-dev libjemalloc-dev sqlite3

      # bin/rh fixture of Roundhouse makes the app with `rails new`.
      - name: Install Rails
        run: gem install rails -v 8.1.4 --no-document

      - name: Restore spinel
        id: spinel-cache
        uses: actions/cache/restore@v6
        with:
          path: deps/spinel
          key: spinel-${{ runner.os }}-${{ hashFiles('SPINEL_COMMIT') }}

      - name: Fetch and build spinel
        run: make -j$(nproc) deps

      # The build of Roundhouse is incremental, so an older target also
      # helps the main.
      - name: Restore the build of Roundhouse
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            deps/roundhouse/target
          key: roundhouse-${{ runner.os }}-${{ hashFiles('ROUNDHOUSE_COMMIT') }}
          restore-keys: roundhouse-${{ runner.os }}-

      - name: Build
        run: make -j$(nproc)

      - name: make roundhouse (the pin)
        run: make roundhouse

      - name: make test-roundhouse (the pin)
        run: make test-roundhouse

      - name: make upgrade_roundhouse (the main of Roundhouse)
        run: make upgrade_roundhouse
